name: Android APK ve AAB
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Web oyununu Android asset'e kopyala
        run: |
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html
      - name: APK ve AAB olustur
        run: |
          gradle --no-daemon :app:assembleRelease :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Kelimelerin-Labirenti-APK-AAB
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
