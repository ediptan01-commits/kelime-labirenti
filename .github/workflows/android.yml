name: Android APK ve AAB
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 35 kur (runner SDK)
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "SDK: $ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          echo "SDK Manager: $SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          test -d "$ANDROID_HOME/platforms/android-35"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Web oyununu Android paketine kopyala
        run: |
          mkdir -p app/src/main/assets
          test -s index.html
          cp index.html app/src/main/assets/index.html
          test -s app/src/main/assets/index.html

      - name: Derle ve hata kaydini sakla
        shell: bash
        run: |
          set -o pipefail
          gradle --version
          gradle --no-daemon --stacktrace --warning-mode all :app:assembleRelease :app:bundleRelease 2>&1 | tee android-build.log

      - name: APK ve AAB dosyalarini kontrol et
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          ls -lh app/build/outputs/apk/release/app-release.apk app/build/outputs/bundle/release/app-release.aab

      - name: APK ve AAB yi yukle
        uses: actions/upload-artifact@v4
        with:
          name: Kelimelerin-Labirenti-APK-AAB
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Basarisizlikta hata kaydini yukle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Derleme-Hata-Kaydi
          path: android-build.log
          if-no-files-found: ignore
