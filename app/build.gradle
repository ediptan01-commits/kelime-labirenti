plugins { id 'com.android.application' }

android {
    namespace 'com.teknolojix.kelimelabirenti'
    compileSdk 35

    defaultConfig {
        applicationId 'com.teknolojix.kelimelabirenti'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    buildTypes {
        release {
            minifyEnabled false
            // Prototip APK/AAB kurulum testi için debug anahtarı ile imzalanır.
            // Play Store'a yüklemek için gerçek upload key ile değiştirilmelidir.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
